# CI: runs scripts/ci.sh (format, lints, tests, licenses, unused deps, copy-paste) on every push and PR.
# The check list lives in scripts/ci.sh only, so CI, the pre-commit hook and local runs stay identical.
name: CI

# Pushes to master and all PRs; doc-only changes are skipped.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]

# A newer push to the same branch cancels the older, still-running run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's Linux system dependencies (audio, input, windowing).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # rust-toolchain.toml selects the pinned toolchain automatically.
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      - name: Checks
        run: ./scripts/ci.sh
        env:
          TEST_PROFILE: ci
