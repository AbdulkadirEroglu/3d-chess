# CI: format, lints, tests, licenses, unused deps and copy-paste detection on every push and PR.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy's Linux system dependencies (audio, input, windowing).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # rust-toolchain.toml selects the pinned toolchain automatically.
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Licenses and advisories
        run: cargo deny check

      - name: Unused dependencies
        run: cargo machete

      - name: Copy-paste detection
        run: npx --yes jscpd@4 crates --format rust --min-lines 8 --threshold 3 --gitignore
