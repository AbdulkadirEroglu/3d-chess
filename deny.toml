# cargo-deny policy. See TECH_STACK.md "License policy".
# GPL, AGPL and LGPL are deliberately absent: they conflict with Steamworks and the App Store.

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates depend on each other by path; they're never published, so that's fine.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Only flag unmaintained crates we depend on directly; deep Bevy dependencies are Bevy's to replace.
unmaintained = "workspace"
# Every ignore needs a reason and gets re-checked at each Bevy upgrade.
ignore = [
    # ruzstd 0.8 decompression bomb. Pinned by bevy_image 0.20 (fix is 0.9.1, semver-incompatible).
    # Only reachable by loading untrusted zstd/KTX2 textures; we load only our own assets.
    { id = "RUSTSEC-2026-0344", reason = "transitive via bevy_image 0.20; we only load our own assets" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
